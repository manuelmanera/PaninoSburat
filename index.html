<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grest 2026 - BELLA FRA!</title>
    <style>
        body { background: #6bc9be; font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; color: #333; }
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 25px; box-sizing: border-box; }
        .login-card { background: white; padding: 40px 30px; border-radius: 35px; text-align: center; width: 100%; max-width: 350px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 4px solid #3d7a73; }
        #bacheca { display: none; padding: 15px; box-sizing: border-box; }
        .header { background: #3d7a73; color: white; padding: 20px; border-radius: 30px; text-align: center; margin-bottom: 20px; border: 3px solid white; }
        .logo-img { width: 140px; margin-bottom: 10px; }
        .white-section { background: white; padding: 20px; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .post { background: white; padding: 20px; border-radius: 25px; margin-bottom: 15px; border-left: 10px solid #3d7a73; box-shadow: 0 5px 15px rgba(0,0,0,0.08); position: relative; }
        .post-title { font-size: 22px; font-weight: 900; color: #3d7a73; text-transform: uppercase; margin-bottom: 10px; padding-right: 30px; }
        .post-label { font-weight: bold; color: #3d7a73; text-transform: uppercase; font-size: 11px; display: block; margin-top: 12px; }
        .post-field { font-size: 14px; line-height: 1.5; color: #444; }
        .del-btn { position: absolute; top: 15px; right: 15px; background: #ff4757; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #f0f0f0; border-radius: 15px; box-sizing: border-box; font-size: 16px; }
        .btn { background: #3d7a73; color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-logout { background: #ff4757; width: 60%; margin: 40px auto; display: block; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; }
        .hidden { display: none !important; }
        .badge-sez { background: #e0f2f1; color: #3d7a73; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <img src="https://i.postimg.cc/VNK87dTf/project-title.png" class="logo-img">
            <h2 style="color:#3d7a73; margin-bottom: 20px;">BELLA FRA!</h2>
            <input type="text" id="user" placeholder="Username" autocapitalize="none">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn" onclick="login()">ENTRA</button>
        </div>
    </div>

    <div id="bacheca">
        <div class="header">
            <img src="https://i.postimg.cc/VNK87dTf/project-title.png" class="logo-img">
            <h3 id="welcome-txt" style="margin:0;">BENVENUTO</h3>
        </div>

        <div id="pannello-manager" class="white-section hidden">
            <h4 style="margin:0 0 10px 0; color:#3d7a73;">NUOVO ANIMATORE</h4>
            <input type="text" id="new-u" placeholder="Username">
            <input type="text" id="new-p" placeholder="Password">
            <button class="btn" onclick="creaUtente()">AGGIUNGI SQUADRA</button>
        </div>

        <div id="area-post" class="white-section hidden">
            <h4 style="margin:0 0 10px 0; color:#3d7a73;">NUOVA SCHEDA</h4>
            <select id="p-sez" onchange="switchCampi()"></select>
            <input type="text" id="p-titolo" placeholder="Titolo">
            <input type="text" id="p-durata" placeholder="Durata">
            <textarea id="p-amb" rows="2" placeholder="Ambientazione"></textarea>
            <textarea id="p-desc" rows="3" placeholder="Svolgimento / Trama"></textarea>
            <div id="box-giochi" class="hidden">
                <input type="text" id="p-mat" placeholder="Materiale">
                <input type="text" id="p-vince" placeholder="Chi vince">
            </div>
            <div style="background: #fcfcfc; padding: 10px; border-radius: 15px; margin: 10px 0; border: 2px dashed #3d7a73;">
                <input type="file" id="p-file" style="font-size:12px;">
            </div>
            <button class="btn" id="pub-btn" onclick="inviaScheda()">PUBBLICA</button>
        </div>

        <div id="feed"></div>
        <button class="btn-logout" onclick="location.reload()">LOGOUT</button>
    </div>

<script>
    const DB_URL = "https://grest-gestione-default-rtdb.europe-west1.firebasedatabase.app";
    const API_IMGBB = "e05c30b539d34803d792ee42a94460fc";
    let mioProfilo = null;
    let isManager = false;

    async function login() {
        const u = document.getElementById('user').value.trim().toLowerCase();
        const p = document.getElementById('pass').value.trim();
        try {
            const res = await fetch(`${DB_URL}/utenti.json`);
            const utenti = await res.json();
            for (let k in utenti) {
                if (utenti[k].username === u && utenti[k].password === p) mioProfilo = utenti[k];
            }
            if (mioProfilo) {
                isManager = (mioProfilo.username === 'manager' || mioProfilo.ruolo === 'manager');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('bacheca').style.display = 'block';
                document.getElementById('welcome-txt').innerText = "BELLA " + mioProfilo.username.toUpperCase() + "!";
                setupUI();
                caricaSchede();
            } else { alert("Dati errati!"); }
        } catch (e) { alert("Errore database!"); }
    }

    function setupUI() {
        const sel = document.getElementById('p-sez');
        sel.innerHTML = '<option value="">Categoria...</option>';
        if (isManager) document.getElementById('pannello-manager').classList.remove('hidden');
        const opzioni = isManager ? ["BALLI", "STORIA", "GIOCHI", "LAB"] : (mioProfilo.permessi || []);
        if (opzioni.length > 0) {
            document.getElementById('area-post').classList.remove('hidden');
            opzioni.forEach(o => sel.innerHTML += `<option value="${o}">${o}</option>`);
        }
    }

    function switchCampi() {
        const sez = document.getElementById('p-sez').value;
        document.getElementById('box-giochi').className = (sez === "GIOCHI") ? "" : "hidden";
    }

    async function creaUtente() {
        const u = document.getElementById('new-u').value.trim().toLowerCase();
        const p = document.getElementById('new-p').value.trim();
        if(!u || !p) return alert("Inserisci dati!");
        const nuovo = { username: u, password: p, ruolo: 'animatore', permessi: ["BALLI", "STORIA", "GIOCHI", "LAB"] };
        await fetch(`${DB_URL}/utenti.json`, { method: "POST", body: JSON.stringify(nuovo) });
        alert("Animatore creato!");
        document.getElementById('new-u').value = ""; document.getElementById('new-p').value = "";
    }

    async function inviaScheda() {
        const file = document.getElementById('p-file').files[0];
        const btn = document.getElementById('pub-btn');
        btn.innerText = "CARICO..."; btn.disabled = true;
        let fUrl = "", fType = "";
        if (file) {
            const fd = new FormData();
            if (file.type.startsWith("image/")) {
                fd.append("image", file);
                const r = await fetch(`https://api.imgbb.com/1/upload?key=${API_IMGBB}`, { method: "POST", body: fd });
                const d = await r.json(); fUrl = d.data.url; fType = "img";
            } else {
                fd.append("file", file);
                const r = await fetch("https://file.io", { method: "POST", body: fd });
                const d = await r.json(); fUrl = d.link; fType = "pdf";
            }
        }
        const payload = {
            autore: mioProfilo.username,
            sezione: document.getElementById('p-sez').value,
            titolo: document.getElementById('p-titolo').value,
            durata: document.getElementById('p-durata').value,
            amb: document.getElementById('p-amb').value,
            desc: document.getElementById('p-desc').value,
            mat: (document.getElementById('p-sez').value === "GIOCHI") ? document.getElementById('p-mat').value : "",
            vince: (document.getElementById('p-sez').value === "GIOCHI") ? document.getElementById('p-vince').value : "",
            url: fUrl, type: fType, ts: Date.now()
        };
        await fetch(`${DB_URL}/posts.json`, { method: "POST", body: JSON.stringify(payload) });
        location.reload();
    }

    async function eliminaPost(id) {
        if (confirm("Vuoi eliminare questa scheda?")) {
            await fetch(`${DB_URL}/posts/${id}.json`, { method: "DELETE" });
            location.reload();
        }
    }

    async function caricaSchede() {
        const res = await fetch(`${DB_URL}/posts.json`);
        const data = await res.json();
        const feed = document.getElementById('feed');
        if (!data) return;
        const ids = Object.keys(data).sort((a,b) => data[b].ts - data[a].ts);
        ids.forEach(id => {
            const p = data[id];
            let extra = (p.sezione === "GIOCHI") ? `<div class="post-field"><span class="post-label">Materiale</span>${p.mat || '-'}</div><div class="post-field"><span class="post-label">Vince chi</span>${p.vince || '-'}</div>` : "";
            let fileHtml = p.url ? (p.type === 'img' ? `<img src="${p.url}" style="width:100%; border-radius:15px; margin-top:15px;">` : `<a href="${p.url}" target="_blank" style="display:block; margin-top:10px; background:#3d7a73; color:white; text-align:center; padding:15px; border-radius:15px; text-decoration:none; font-size:14px; font-weight:bold;">📄 SCARICA PDF</a>`) : "";
            let delBtn = isManager ? `<button class="del-btn" onclick="eliminaPost('${id}')">X</button>` : "";
            feed.innerHTML += `
                <div class="post">
                    ${delBtn}
                    <span class="badge-sez">${p.sezione}</span>
                    <div style="font-size:10px; color:#888; margin-bottom:5px;">AUTORE: ${p.autore.toUpperCase()}</div>
                    <div class="post-title">${p.titolo}</div>
                    <div class="post-field"><span class="post-label">Durata</span>${p.durata}</div>
                    <div class="post-field"><span class="post-label">Ambientazione</span>${p.amb}</div>
                    <div class="post-field"><span class="post-label">Svolgimento</span>${p.desc}</div>
                    ${extra}${fileHtml}
                </div>`;
        });
    }
</script>
</body>
</html>
